services:
  db:
    # Digest-pinned: a test run must be reproducible, and a re-pushed
    # 17.5-alpine tag would make yesterday's green run unreproducible. See
    # compose.yaml for how to move the pin forward.
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    # Isolated test credentials: ephemeral per run, exported by
    # run-full-stack-tests.sh as POSTGRES_TEST_* so a development export can
    # never become the test password (and vice versa).
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-papermind_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-papermind_test}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_TEST_USER:-papermind_test} -d $${POSTGRES_TEST_DB:-papermind_test}"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    ports:
      - "127.0.0.1:56333:6333"
      - "127.0.0.1:56334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 2s
      timeout: 3s
      retries: 30
