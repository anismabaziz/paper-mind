[project]
name = "backend"
version = "0.1.0"
description = "PaperMind backend: RAG chat over uploaded documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "bcrypt>=4.2.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "google-genai>=1.68.0",
    "groq>=1.2.0",
    "langchain-text-splitters>=1.1.1",
    "pinecone>=8.1.0",
    "psycopg[binary]>=3.2.0",
    "pymupdf>=1.27.2.2",
    "pyjwt>=2.10.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.15.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.1.0",
    "sqlalchemy>=2.0.0",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
docling = [
    "docling>=2.40.0",
    # granite-docling-258M weights (~1.1GB) are downloaded via HF_HOME cache,
    # not a pip package; docling pulls transformers + huggingface-hub.
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
