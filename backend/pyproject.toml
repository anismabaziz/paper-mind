[project]
name = "backend"
version = "0.1.0"
description = "PaperMind backend: RAG chat over uploaded documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "google-genai>=1.68.0",
    "groq>=1.2.0",
    "langchain-text-splitters>=1.1.1",
    "psycopg[binary]>=3.2.0",
    "pymupdf>=1.27.2.2",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=3.1.0",
    "sqlalchemy>=2.0.0",
    "tiktoken>=0.14.0",
    "cryptography>=46.0.6",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
docling = [
    "docling>=2.40.0",
    # granite-docling-258M weights (~1.1GB) are downloaded via HF_HOME cache,
    # not a pip package; docling pulls transformers + huggingface-hub.
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "full_stack: HTTP tests backed by real Postgres and Qdrant",
]

[tool.mypy]
python_version = "3.11"
files = [
    "app.py",
    "composition.py",
    "db.py",
    "evaluation/evaluator.py",
    "repositories",
    "routes",
    "services/chat_context.py",
    "services/indexing",
    "services/ingestion",
    "services/retrieval",
    "services/titles.py",
]
check_untyped_defs = true
follow_imports = "silent"
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["D"]
ignore = ["D212"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["filter"]
