services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: papermind
      POSTGRES_PASSWORD: papermind
      POSTGRES_DB: papermind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papermind"]
      interval: 2s
      timeout: 3s
      retries: 15

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      # VECTOR_BACKEND is read by the app; qdrant itself needs no config.
      # Exposed on localhost:6333 for host runs and on qdrant:6333 inside compose.
      QDRANT__SERVICE__GRPC_PORT: 6334

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://papermind:papermind@db:5432/papermind
      VECTOR_BACKEND: ${VECTOR_BACKEND:-qdrant}
      EMBED_BACKEND: ${EMBED_BACKEND:-local}
      QDRANT_URL: http://qdrant:6333
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-BAAI/bge-m3}
      MODE: ${MODE:-google}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-false}
      # Opt-in layout parser: USE_DOCLING=true forces Docling, auto (default) uses
      # lightweight heuristic (image-only / 2-col / borderless-table) to route
      # only those PDFs to Docling; others stay on pymupdf fast path.
      USE_DOCLING: ${USE_DOCLING:-auto}
      # Hugging Face cache: keep BGE-M3 (~2GB) and granite-docling-258M (~1.1GB)
      # on a persistent volume so downloads only happen on first run. Host cache
      # is also respected when running outside Docker via HF_HOME.
      HF_HOME: /app/.cache/huggingface
      HF_HUB_CACHE: /app/.cache/huggingface/hub
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/data/storage
      - hf_cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  pgdata:
  qdrant_storage:
  uploads:
  hf_cache:
