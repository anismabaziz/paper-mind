name: Scheduled audit

# The half of the audit that cannot gate a pull request.
#
# Asking a provider whether it still serves a model takes a paid round trip and
# needs that provider's key, so it belongs here rather than in the pull-request
# checks: the answer is about the provider's catalogue, not about the branch.
# The failure modes are different too. A red CI job means someone merged
# something; a red scheduled job means the world moved underneath the project,
# and the response is to remove a dead model from the catalogue or to accept a
# new advisory.
#
# A dependency bump and a retired model are reported as separate jobs on
# purpose. They have different causes, different owners, and different
# follow-ups, and one of them failing must not hide the other.

on:
  schedule:
    # Off the hour on purpose: providers publish advisories and retire models
    # on their own schedule, and there is no reason to join the top-of-hour
    # stampede against every other scheduled workflow.
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install the locked environment
        run: uv sync --frozen --dev

      # Advisory databases grow between releases, so this reports findings the
      # pull-request audit did not see. Both halves run and both are reported:
      # a direct-dependency advisory that appeared since the last release is
      # the one worth acting on today.
      - name: Audit Python dependencies
        run: uv run python -m audit.cli python

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the locked tree
        run: npm ci --prefix ../frontend

      - name: Audit Node dependencies
        run: uv run python -m audit.cli node

  models:
    name: Model availability
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install the locked environment
        run: uv sync --frozen --dev

      # Every catalogue entry is asked directly, with a one-token completion
      # per model. A provider that has retired a model is the only way to find
      # out before a user does.
      - name: Check every catalogue model
        run: uv run python -m audit.cli models
        env:
          # Read from the environment, never passed as an argument: a command
          # line is visible to every process on the runner and lands in the
          # job log. The check reports which variable was missing and never
          # prints a value.
          PAPERMIND_CHECK_GOOGLE_API_KEY: ${{ secrets.PAPERMIND_CHECK_GOOGLE_API_KEY }}
          PAPERMIND_CHECK_GROQ_API_KEY: ${{ secrets.PAPERMIND_CHECK_GROQ_API_KEY }}

      # An unpinned or deleted local revision is found the same way: the
      # recorded identity has to still exist upstream.
      - name: Check every pinned revision resolves
        run: uv run --no-project python -m audit.cli revisions
