name: Dependency audit

# Deterministic half of the audit: given the same lockfiles and the same
# advisory database, the answer does not change, so it is safe to gate a pull
# request on. The scheduled half — which models the providers still serve —
# lives in scheduled-audit.yml, because it needs the network and the provider
# keys and because a red nightly job should read as a signal, not as a build
# someone broke.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # An operator can ask for the audit on their own branch without pushing a
  # no-op commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      # The audit reads what is installed, so it audits the lockfile rather
      # than a range in pyproject.toml.
      - name: Install the locked environment
        run: uv sync --frozen --dev

      # A vulnerable direct dependency fails here. An advisory the project has
      # decided to accept does not: the decision and its reason live in
      # backend/audit/accepted.json, so accepting one is a reviewed change
      # rather than a flag on a command line.
      - name: Audit
        run: uv run python -m audit.cli python

  node:
    name: Node dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs package-lock.json exactly and fails when it disagrees
      # with package.json.
      - name: Install the locked tree
        run: npm ci --prefix ../frontend

      - name: Install the locked environment
        run: uv sync --frozen --dev

      # Run from backend/, where the audit package lives; it shells out to npm
      # in frontend/ itself.
      - name: Audit
        run: uv run python -m audit.cli node

  revisions:
    name: Pinned model revisions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      # A pin that no longer resolves is worse than no pin: the recorded
      # identity is fiction, and the load falls back to whatever the
      # repository serves now. Three HTTP calls, no model weights.
      - name: Check every pin resolves upstream
        run: uv run --no-project python -m audit.cli revisions

  comparison:
    name: Evaluation comparison due
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The comparison against the base branch is a diff, and a shallow
          # clone has no merge base to diff against.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      # Says which of the changed files can move a published measurement, so
      # the omission is visible in the job log. It does not fail: a security
      # patch should not need a paid live run before it can merge, and the
      # pull request is where the comparison is attached and read.
      - name: Report whether a comparison is due
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref || 'main' }}...HEAD")
          uv run --no-project python -m audit.cli comparison --changed "$changed"
