name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # An operator can run the whole check suite on their own branch without
  # pushing a no-op commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci installs package-lock.json exactly and fails if it disagrees
        # with package.json, so this is already frozen.
        run: npm ci

      - name: Lint
        run: npm run lint

      # build runs `tsc -b` first, covering the type-check; it fails fast
      # when VITE_API_URL is missing or not an http(s) URL (see vite.config.ts)
      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:3000

  backend:
    name: Backend (lint + types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          # Pinned to the minimum supported Python (requires-python >=3.11,
          # mypy targets 3.11): the lockfile resolves numpy 2.5+ on 3.12,
          # whose stubs use `type` syntax that mypy under a 3.11 target
          # rejects.
          python-version: "3.11"

      - name: Install dependencies
        # --frozen installs the lockfile as committed and fails when it does
        # not match pyproject.toml, so a build can never resolve a version
        # nobody reviewed. Plain `uv sync` would quietly re-resolve and
        # re-lock, which is how a build starts testing something other than
        # what ships.
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

  evaluation-report:
    name: Evaluation report (thresholds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The published reports are re-rendered from the committed numbers and held
    # to the bounds in evaluation/thresholds.json. Nothing here measures
    # anything: a live run needs two provider keys and a real index, and a CI
    # job that spent either would be a job nobody could run on a fork. So this
    # checks that the report a reviewer reads still says what it said, and fails
    # only where a person wrote down a bound to be failed on.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          # Pinned to the minimum supported Python, for the reason given in the
          # backend job.
          python-version: "3.11"

      - name: Install dependencies
        # --frozen: see the backend job.
        run: uv sync --frozen --dev

      - name: Render the published reports
        run: |
          # Each kind of report is held to bounds on the numbers it measured: a
          # retrieval run has no answers and no tokens, so the answer bounds
          # would cross for the honest reason that there is nothing to bound.
          uv run python -m evaluation.cli \
            --render evaluation/reports/2026-09-retrieval-baseline-v1 \
            --check evaluation/thresholds-retrieval.json
          uv run python -m evaluation.cli \
            --render evaluation/reports/2026-09-retrieval-tuning-v1 \
            --check evaluation/thresholds-retrieval.json
          uv run python -m evaluation.cli \
            --render evaluation/reports/2026-09-answers-baseline-v1 \
            --check evaluation/thresholds.json

      # Always, and not only on failure: the digest is the artifact a person
      # opens when a bound is crossed, and it is the reason to keep the run.
      - name: Upload the rendered reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: backend/evaluation/reports/*/digest.*
          retention-days: 14
