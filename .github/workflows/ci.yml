name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      # build runs `tsc -b` first, covering the type-check; it fails fast
      # when VITE_API_URL is missing or not an http(s) URL (see vite.config.ts)
      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:3000

  backend:
    name: Backend (lint + types + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          # Pinned to the minimum supported Python (requires-python >=3.11,
          # mypy targets 3.11): the lockfile resolves numpy 2.5+ on 3.12,
          # whose stubs use `type` syntax that mypy under a 3.11 target
          # rejects.
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

  full-stack:
    name: Full stack (HTTP + Postgres + Qdrant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Test
        run: ./run-full-stack-tests.sh

  browser:
    name: Browser (Playwright + Postgres + Qdrant)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Start Postgres and Qdrant
        run: docker compose -f ../backend/compose.test.yaml up -d --wait
        # The Playwright webServer starts the deterministic browser backend
        # and the Vite dev server itself; only the backing services are
        # needed up front.

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install backend dependencies
        run: uv sync --dev
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e112508b939b8d59410638fdb16b1d # v4.6.2
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f ../backend/compose.test.yaml down --volumes
