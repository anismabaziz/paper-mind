name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # An operator can run the whole check suite on their own branch without
  # pushing a no-op commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci installs package-lock.json exactly and fails if it disagrees
        # with package.json, so this is already frozen.
        run: npm ci

      - name: Lint
        run: npm run lint

      # build runs `tsc -b` first, covering the type-check; it fails fast
      # when VITE_API_URL is missing or not an http(s) URL (see vite.config.ts)
      - name: Type-check and build
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:3000

  backend:
    name: Backend (lint + types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          # Pinned to the minimum supported Python (requires-python >=3.11,
          # mypy targets 3.11): the lockfile resolves numpy 2.5+ on 3.12,
          # whose stubs use `type` syntax that mypy under a 3.11 target
          # rejects.
          python-version: "3.11"

      - name: Install dependencies
        # --frozen installs the lockfile as committed and fails when it does
        # not match pyproject.toml, so a build can never resolve a version
        # nobody reviewed. Plain `uv sync` would quietly re-resolve and
        # re-lock, which is how a build starts testing something other than
        # what ships.
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Unit tests
        # Plain pytest collects tests/unit only (see testpaths in
        # backend/pyproject.toml): fast, no network, database, or models.
        run: uv run pytest

      - name: Integration tests
        # Flask app over fakes with real temp storage: no services needed.
        run: uv run pytest tests/integration

  backend-slow:
    name: Backend slow tests (infra + models)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: papermind
          POSTGRES_PASSWORD: test
          POSTGRES_DB: papermind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    env:
      POSTGRES_USER: papermind
      POSTGRES_PASSWORD: test
      POSTGRES_TEST_DB: papermind_test

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Cache model weights
        # BGE-M3 and MiniLM download once, then reuse. The suite downloads
        # them itself on a cold cache.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('backend/uv.lock') }}
          restore-keys: hf-models-

      - name: Slow tests
        # Real Postgres, Qdrant, parsing, and model weights. Skips suites
        # whose service is unreachable instead of failing the run.
        run: uv run pytest tests/slow
